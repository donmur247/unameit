# Basic configuration template for UNameIt
#
# Tokens are written as `@name` and OmegaConf interpolations as `${...}`.
# Quote template strings, since YAML doesn't allow a plain value to start with `@`.

tokens:
  root:
    default: /projects
    # Root per OS. Only the current OS entry is used; `default` is used when it's missing.
    os:
      linux: "${tokens.root.default}"
      windows: "P:"
      macos: "${tokens.root.default}"
  project:
    pattern: "[a-zA-Z0-9-]"
  asset_category:
    pattern: "[a-zA-Z0-9-]"
  asset_name:
    pattern: "[a-zA-Z0-9-]"
  asset_variant:
    default: "main"
    pattern: "[a-zA-Z0-9-]"
  episode:
    pattern: "[a-zA-Z0-9]"
  sequence:
    pattern: "[a-zA-Z0-9]"
  shot:
    pattern: "[a-zA-Z0-9]"
  dcc:
    pattern: "[a-zA-Z0-9]"

templates:
  # Template with empty value, treated as not found by build_path()
  empty_template: ""
  project_root: "@root/@project"
  assets:
    root: "${templates.project_root}/assets"
    category_root: "${.root}/@asset_category"
    name_root: "${.category_root}/@asset_name"
    variant_root: "${.name_root}/@asset_variant"
    publish_root: "${.variant_root}/publish"
    work_root: "${.variant_root}/work"
    work_dcc_root: "${.work_root}/@dcc"
  shots:
    root: "${templates.project_root}/shots"
    episode_root: "${.root}/@episode"
    sequence_root: "${.episode_root}/@sequence"
    shot_root: "${.sequence_root}/@shot"
    shot_publish_root: "${.shot_root}/publish"
    shot_work_root: "${.shot_root}/work"
    shot_work_dcc_root: "${.shot_work_root}/@dcc"
