# Basic configuration template for UNameIt

tokens:
  root:
    default: /projects
    # Root per OS. Only the current OS entry is used; `default` is used when it's missing.
    os:
      linux: "${tokens.root.default}"
      windows: "P:"
      macos: "${tokens.root.default}"
  project:
    pattern: "[a-zA-Z0-9-]"

templates:
  # Template with empty value, treated as not found by build_path()
  empty_template: ""
  project_root: $root/$project
