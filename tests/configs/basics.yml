# Basic configuration template for UNameIt
#
# Tokens are written as `@{name}`, and OmegaConf interpolations as `${...}`.
# Token symbol `@{}` will refer to a token defined in the `tokens` section.
# Quote template strings, since YAML doesn't allow a plain value to start with `@`.

tokens:
  root:
    default: /projects
    # Root per OS. Only the current OS entry is used; `default` is used when it's missing.
    os:
      linux: "${tokens.root.default}"
      windows: "P:"
      macos: "${tokens.root.default}"
  project:
    pattern: '[a-zA-Z0-9-]'
  asset_category:
    pattern: '[a-zA-Z0-9-]'
  asset_name:
    pattern: '[a-zA-Z0-9-]'
  asset_variant:
    default: "main"
    pattern: '[a-zA-Z0-9-]'
  episode:
    pattern: '[a-zA-Z0-9]'
  sequence:
    pattern: '[a-zA-Z0-9]'
  shot:
    pattern: '[a-zA-Z0-9]'
  task:
    pattern: '[a-zA-Z-]'
  task_description:
    pattern: '[a-zA-Z-]'
  dcc:
    pattern: '[a-zA-Z0-9]'
  version:
    default: "v001"
    pattern: 'v\d+'
  extension:
    pattern: '\.[a-z]+'
  material_name:
    pattern: '[a-zA-Z0-9-]'
  channel_name:
    pattern: '[a-zA-Z]'
  udim:
    pattern: '\d{4}'


templates:
  # Template with empty value, treated as not found by build_path()
  empty_template: ""
  project_root: "@{root}/@{project}"
  task_type: "@{task}_@{task_description}"
  assets:
    root: "${templates.project_root}/assets"
    category_root: "${.root}/@{asset_category}"
    name_root: "${.category_root}/@{asset_name}"
    variant_root: "${.name_root}/@{asset_variant}"
    publish_root: "${.variant_root}/publish"
    work_root: "${.variant_root}/work"
    work_dcc_root: "${.work_root}/${templates.task_type}/@{dcc}"

    scene_name: "@{project}_@{asset_category}_@{asset_name}_@{asset_variant}_${templates.task_type}_@{version}"
    # This texture name is an example to show optional token where if it is not provided it will be
    # skipped and process the next token.
    texture_name: "@{material_name}_@{channel_name}[.@{udim}]@{extension}"

    # Maya project examples
    maya_work_root: "${.work_root}/${templates.task_type}/maya"
    maya_work_scene_root: "${.maya_work_root}/scenes"
    maya_work_scene: "${.maya_work_scene_root}/${.scene_name}@{extension}"
    maya_work_sourceimages_root: "${.maya_work_root}/sourceimages"
    maya_work_texture: "${.maya_work_sourceimages_root}/${.texture_name}"
    maya_work_images_root: "${.maya_work_root}/images"
    maya_work_cache_root: "${.maya_work_root}/cache"

  shots:
    root: "${templates.project_root}/shots"
    episode_root: "${.root}/@{episode}"
    sequence_root: "${.episode_root}/@{sequence}"
    shot_root: "${.sequence_root}/@{shot}"
    shot_publish_root: "${.shot_root}/publish"
    shot_work_root: "${.shot_root}/work"
    shot_work_dcc_root: "${.shot_work_root}/@{dcc}"
